services:
  influxdb:
    image: influxdb:2.7
    container_name: singularity-influx
    ports:
      - "47086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?set INFLUX_ADMIN_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-singularity}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET_RAW:-crypto_raw}
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
      - ./influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  influx-init:
    build: .
    image: singularity-capture:latest
    container_name: singularity-influx-init
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
    command: ["influx-init"]
    restart: "no"

  capture:
    build: .
    image: singularity-capture:latest
    container_name: singularity-capture
    depends_on:
      influxdb:
        condition: service_healthy
      influx-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Inside the compose network we reach influx by service name, not host port
      INFLUX_URL: http://influxdb:8086
    restart: unless-stopped

  executor:
    build: .
    image: singularity-capture:latest
    container_name: singularity-executor
    # Run as Unraid's nobody:users so bind-mounted state/logs are writable
    # without host-side chown. On non-Unraid Docker hosts, chown ./state and
    # ./logs to match (or override via `user:` in a local compose override).
    user: "99:100"
    depends_on:
      influxdb:
        condition: service_healthy
      influx-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    command: ["executor"]
    restart: unless-stopped

  watchdog:
    build: .
    image: singularity-capture:latest
    container_name: singularity-watchdog
    user: "99:100"
    env_file:
      - .env
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    command: ["watchdog"]
    restart: unless-stopped
