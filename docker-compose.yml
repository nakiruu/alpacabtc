services:
  influxdb:
    image: influxdb:2.7
    container_name: singularity-influx
    ports:
      - "47086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: change-me-please
      DOCKER_INFLUXDB_INIT_ORG: singularity
      DOCKER_INFLUXDB_INIT_BUCKET: crypto_raw
      DOCKER_INFLUXDB_INIT_RETENTION: 90d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-change-me
    volumes:
      - ./influxdb_data:/var/lib/influxdb2
      - ./influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: singularity-grafana
    ports:
      - "43137:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: change-me-please
      GF_INSTALL_PLUGINS: ""
    volumes:
      - ./grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    restart: unless-stopped

  influx-init:
    build: .
    image: singularity-capture:latest
    container_name: singularity-influx-init
    depends_on:
      influxdb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      INFLUX_URL: http://influxdb:8086
    command: ["influx-init"]
    restart: "no"

  capture:
    image: singularity-capture:latest
    container_name: singularity-capture
    depends_on:
      influxdb:
        condition: service_healthy
      influx-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Override .env's localhost — inside the compose network we reach influx by service name
      INFLUX_URL: http://influxdb:8086
    volumes:
      - ./state:/app/state
      - ./logs:/app/logs
    restart: unless-stopped
