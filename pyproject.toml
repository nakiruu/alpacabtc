[project]
name = "singularity"
version = "0.0.1"
description = "Systematic BTC trading on Alpaca — cost-honest, execution-first"
requires-python = ">=3.11"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27",
    "influxdb-client>=1.45",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "orjson>=3.10",
    "structlog>=24.4",
    "tenacity>=9.0",
    "sortedcontainers>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
capture = "singularity.adapters.alpaca_crypto.stream:main"
influx-init = "singularity.ops.influx_init:main"
report = "singularity.ops.report:main"
calibrate = "singularity.costs.calibration:main"
executor = "singularity.execution.main:main"
reconcile = "singularity.execution.reconcile:main"
watchdog = "singularity.execution.watchdog:main"
activities-sync = "singularity.execution.activities:main"
place-test-order = "singularity.execution.place_order:main"
close-position = "singularity.execution.close_position:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["singularity"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
